services:
  exoml:  # you can change this to whatever you want.
    container_name: iatson_planet
    image: exoml:latest
    user: theuser
    volumes:
      - "/data/scratch/:/data/scratch/"
      - "/data/scratch_hard/:/data/scratch_hard/"
      - "/home/mdevo/exoml/:/usr/bin/exoml/"
    ports:
     - "5678:5678"
    #entrypoint:
    #  - /usr/bin/bash
    #command:
    #  - "tail -F waitForever"
    tty: true
    deploy:
      resources:
        reservations:
          devices:
          -  driver: nvidia
             count: all
             capabilities: [gpu]